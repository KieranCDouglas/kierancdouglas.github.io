<!DOCTYPE html>
<html lang="en" data-theme="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }} | {{ site.title }}</title>
    {%- seo -%}

    <!-- Set theme before first paint (no flash of light mode) -->
    <script>
      (function(){try{var t=localStorage.getItem('theme');if(!t){t=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
    </script>

    <!-- Google Fonts: Fraunces (display), Instrument Sans (UI), IBM Plex Mono (mono) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    >

    <!-- Site styles (keep AFTER fonts) -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="icon" href="data:,">
  </head>
  <body>
    {{ content }}

    <footer class="site-footer">
      <div class="container">
        <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
      </div>
    </footer>

    <!-- Theme toggle: any element with .js-theme-toggle flips light/dark -->
    <script>
    (function () {
      var KEY = 'theme';
      var root = document.documentElement;
      var saved = localStorage.getItem(KEY);
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      function setTheme(t) {
        root.setAttribute('data-theme', t);
        try { localStorage.setItem(KEY, t); } catch (e) {}
      }
      setTheme(saved || (prefersDark ? 'dark' : 'light'));
      document.addEventListener('click', function (e) {
        if (!e.target.closest('.js-theme-toggle')) return;
        setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
    })();
    </script>
  </body>
</html>
