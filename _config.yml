# -------------------------------------------------------------
# Site Information
# -------------------------------------------------------------
title: "Kieran Douglas"
description: "Economics graduate student at UC Davis"
url: "https://kierandouglas.com"    # Full URL to your site
baseurl: ""                         # Leave empty for root domain

# -------------------------------------------------------------
# Author Information
# -------------------------------------------------------------
author:
  name: "Kieran Douglas"
  email: "kcdouglas@ucdavis.edu"

# -------------------------------------------------------------
# Theme & Build Settings
# -------------------------------------------------------------
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  # - jekyll-sitemap   # (optional, supported by GitHub Pages)

# Markdown
markdown: kramdown
kramdown:
  input: GFM

# -------------------------------------------------------------
# Collections
# -------------------------------------------------------------
# Data sources for the single-page home — no standalone pages generated.
collections:
  projects:
    output: false
  others:
    output: false

# -------------------------------------------------------------
# Defaults
# -------------------------------------------------------------
defaults:
  - scope:
      path: ""         # all files
    values:
      layout: "default"

# -------------------------------------------------------------
# File Handling
# -------------------------------------------------------------
exclude:
  - README.md
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - _preview
  - _site
